<!doctype html>
<!-- Картинката за споделяне (og.jpg): снима се с bin/shot.swift на skoba в 1200×630. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0d0f14; color: #dfe5f0;
               font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .wrap { display: flex; align-items: center; gap: 56px; height: 100%; padding: 0 64px; box-sizing: border-box; }
  .text { flex: 1; }
  h1 { margin: 0; font: 900 84px/0.95 "Helvetica Neue", Arial, sans-serif; letter-spacing: -.01em; color: #fff; }
  h1 span { color: #ffd166; }
  p { margin: 26px 0 0; font-size: 26px; line-height: 1.4; color: #b9c4d8; }
  .url { margin-top: 34px; font-size: 24px; color: #ffd166; }
  img { width: 560px; height: 420px; border: 3px solid #2a3142; border-radius: 10px; box-shadow: 0 20px 60px #000c; }
</style></head>
<body><div class="wrap">
  <div class="text">
    <h1>FFX Runner<br><span>playable again</span></h1>
    <p>The mid-2000s Shockwave 3D car chase by Officine Pixel, ported to the modern browser. No plugins.</p>
    <div class="url">ffx.skoba.eu</div>
  </div>
  <img src="../assets/ui/menu.png" alt="">
</div></body></html>
