<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Apache в контейнера е с AllowOverride None и не може да прати заглавки,
     затова молбата да не се кешира е тук. Не е гаранция — затова и main.js
     сверява версията след зареждане. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFX Runner: the Shockwave classic, playable again</title>
<meta name="description" content="FFX Runner by Officine Pixel, the mid-2000s Shockwave 3D car chase, ported to the modern browser with Three.js. No plugins, plays on desktop and phone.">
<link rel="canonical" href="https://ffx.skoba.eu/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ffx.skoba.eu/">
<meta property="og:title" content="FFX Runner: the Shockwave classic, playable again">
<meta property="og:description" content="The mid-2000s Shockwave 3D car chase by Officine Pixel, back in the browser. No plugins.">
<meta property="og:image" content="https://ffx.skoba.eu/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14;
               /* без увеличаване с двойно докосване и без лупа при задържане на телефон */
               touch-action: manipulation; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
               font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #dfe5f0; }
  #app, #app canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; }

  /* Скалите са самите растери на оригинала: празната стои отдолу, пълната
     се показва отгоре, изрязана до стойността. */
  .gauge { position: absolute; top: 8px; width: 132px; height: 132px;
           transition: opacity .08s linear; }
  .gauge.fuel { left: 8px; }
  .gauge.body { right: 8px; }
  .gauge img { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Долният слой е същата картина, само угасена — така рамката и иконата са
     едни и същи и се вижда само докъде свети скалата. Двата растера на
     оригинала (пълен и „base") имат различни икони и при изрязване се биеха. */
  .gauge .off { filter: grayscale(.85) brightness(.4); }
  .gauge .fill { clip-path: inset(0 100% 0 0); }
  .gauge.body .fill { clip-path: inset(0 0 0 100%); }

  @media (max-width: 520px) {
    .gauge { width: 96px; height: 96px; }
  }

  /* Хронометърът на бягането — както в записите на оригинала. */
  #timer { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
           text-align: center; display: none; }
  #timer .now { padding: 2px 14px; border-radius: 8px; background: #0a0d13b3;
                font-size: 26px; font-weight: 700; letter-spacing: .04em;
                color: #f4f6fa; font-variant-numeric: tabular-nums; }
  #timer .best { margin-top: 4px; font-size: 11px; color: #ffd166;
                 text-shadow: 0 1px 2px #000; }
  #timer .nitro { margin-top: 3px; font-size: 11px; letter-spacing: .08em; color: #8fd3ff;
                  text-shadow: 0 1px 2px #000; }
  #timer .nitro i { font-style: normal; opacity: .25; }
  #timer .nitro.on { color: #ffb45c; }
  @media (max-width: 520px) { #timer .now { font-size: 18px; } }

  /* Мини картата — под скалата на каросерията. */
  #minimap { position: absolute; top: 146px; right: 12px; width: 170px; height: 170px;
             display: none; filter: drop-shadow(0 3px 8px #000a); }
  @media (max-width: 520px) { #minimap { top: 108px; width: 118px; height: 118px; } }

  #speedo { position: absolute; right: 18px; bottom: 40px; text-align: right; display: none;
            text-shadow: 0 2px 6px #000c; font-variant-numeric: tabular-nums; }
  #speedo b { font-size: 40px; line-height: 1; color: #f4f6fa; }
  #speedo span { display: block; font-size: 11px; letter-spacing: .15em; color: #93a0b8; }
  #speedo.boost b { color: #ffb45c; }
  @media (max-width: 520px) { #speedo b { font-size: 26px; } }

  /* Началото са екраните на оригинала: splash2 („LOADING...") докато се
     зарежда, после splash3 с бутоните PLAY и HOW TO PLAY. Бутоните са
     нарисувани в картината — отгоре лежат невидими зони за щракване. */
  #splash { position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #0a0d13;
            pointer-events: auto; }
  .sheet43 { position: relative; width: min(100%, calc(80vh * 4 / 3)); aspect-ratio: 4 / 3; }
  .sheet43 > img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #splash .hit { position: absolute; background: transparent; border: 0; cursor: pointer;
                 border-radius: 999px; }
  #splash .hit:hover, #splash .hit:focus-visible { box-shadow: 0 0 0 3px #ffd16699; outline: none; }
  #splash .press { margin-top: 14px; color: #ffd166; letter-spacing: .2em;
                   text-transform: uppercase; font-size: 12px;
                   animation: blink 1.4s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #splash .records { margin-top: 8px; color: #93a0b8; font-size: 12px; }
  #splash .credits { margin-top: 14px; padding: 0 16px; text-align: center; color: #6d7891; font-size: 11px; }
  #splash .credits a, #splash .lang a { color: #93a0b8; }
  #splash .credits a:hover, #splash .lang a:hover { color: #ffd166; }
  #splash .lang { margin-top: 6px; font-size: 12px; }

  #howto { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
           background: #0a0d13ee; pointer-events: auto; cursor: pointer; }
  #howto.on { display: flex; }
  #howto .box { max-width: 560px; margin: 16px; padding: 20px 24px; border-radius: 14px;
                background: #121824; border: 1px solid #2a3142; line-height: 1.6; }
  #howto h3 { margin: 0 0 10px; color: #ffd166; letter-spacing: .1em; text-transform: uppercase; }
  #howto p { margin: 0 0 10px; }
  #howto .back { color: #93a0b8; font-size: 11px; text-align: center; margin-top: 12px; }

  #countdown { position: absolute; inset: 0; display: none; align-items: center;
               justify-content: center; font-size: 140px; font-weight: 700;
               color: #ffd166; text-shadow: 0 6px 40px #000a; }
  #status { position: absolute; inset: 0; display: none; align-items: center;
            justify-content: center; font-size: 16px; color: #93a0b8; }
  #status.error { color: #ff8080; }

  /* Краят е punteggio2 на оригинала — шестте матови панела и отдолу
     „PRESS A KEY TO CONTINUE". Надписите са преведените текстове от .dir:
     „Residual:", „Collect:", „TIME", „SCORE" и състоянието на мисията. */
  #over { position: absolute; inset: 0; display: none; align-items: center;
          justify-content: center; background: #0a0d13; pointer-events: auto; cursor: pointer; }
  #over .panel { position: absolute; display: flex; flex-direction: column; justify-content: center;
                 gap: .1em; font-size: clamp(10px, 2vw, 16px); color: #1c2430;
                 text-shadow: 0 1px 0 #ffffff80; }
  #over .panel.right { align-items: flex-end; text-align: right; }
  #over .panel small { font-size: .72em; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  #over .panel span { opacity: .75; }
  #over .panel b { font-weight: 700; }
  #over .panel .big { font-size: clamp(16px, 4.2vw, 34px); line-height: 1.1; }
  #over-points { color: #b3391a; }
  #over .panel.record b.new { color: #b3391a; }
  #over .status { position: absolute; left: 50%; top: 47.5%; transform: translate(-50%, -50%);
                  text-align: center; white-space: nowrap; }
  #over h2 { margin: 0; padding: 5px 18px; border-radius: 999px; background: #0a0d13d9;
             font-size: clamp(12px, 2.6vw, 22px); color: #ff9d6f; }
  #over h2.won { color: #9fe870; }
  #over .status p { margin: 4px 0 0; font-size: clamp(9px, 1.6vw, 13px); color: #dfe5f0;
                    text-shadow: 0 1px 3px #000; }

  /* Менюто в паузата. */
  #pause { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
           background: #0a0d1399; pointer-events: auto; }
  #pause.on { display: flex; }
  #pause .box { min-width: 260px; padding: 18px 20px; border-radius: 14px; background: #121824f2;
                border: 1px solid #2a3142; display: flex; flex-direction: column; gap: 8px; }
  #pause h3 { margin: 0 0 4px; text-align: center; color: #ffd166; letter-spacing: .15em;
              text-transform: uppercase; }
  #pause button { font: inherit; color: #dfe5f0; background: #1b2230; border: 1px solid #39425a;
                  border-radius: 8px; padding: 7px 12px; cursor: pointer; text-align: left;
                  display: flex; justify-content: space-between; gap: 18px; }
  #pause button:hover, #pause button:focus-visible { border-color: #ffd166; outline: none; }
  #pause button b { color: #ffd166; font-weight: 600; }
  #pause .row { display: flex; gap: 8px; margin-top: 4px; }
  #pause .row button { flex: 1; justify-content: center; }
  #pause .note { margin: 0; font-size: 11px; color: #93a0b8; text-align: center; min-height: 1.4em; }

  /* Докосване: показва се само на устройства с тъч. */
  #touch { position: absolute; inset: 0; display: none; pointer-events: none; }
  #touch.on { display: block; }
  /* на началния екран бутоните само пречат: показват се, когато бягането започне */
  body:not(.playing) #touch { display: none; }
  #touch button { position: absolute; pointer-events: auto; width: 68px; height: 68px;
                  border-radius: 50%; border: 2px solid #ffffff55; background: #0a0d1366;
                  color: #fff; font: 700 22px/1 ui-monospace, monospace; touch-action: none;
                  user-select: none; -webkit-user-select: none; }
  #touch button.down { background: #ffd16688; border-color: #ffd166; }
  #touch .left  { left: 16px;  bottom: 22px; }
  #touch .right { left: 96px;  bottom: 22px; }
  #touch .gas   { right: 16px; bottom: 96px; width: 80px; height: 80px; }
  #touch .back  { right: 104px; bottom: 22px; }
  #touch .brake { right: 16px; bottom: 16px; width: 80px; height: 72px; border-radius: 16px; font-size: 13px; }
  #touch .nitro { right: 108px; bottom: 100px; width: 56px; height: 56px; font-size: 15px; color: #8fd3ff; }
  #touch .pause { left: 16px; top: 150px; width: 42px; height: 42px; font-size: 16px; }
  body.touch #keys { display: none; }
  /* С бутоните долу скоростомерът отива под картата. */
  body.touch #speedo { bottom: auto; top: 330px; }
  @media (max-width: 520px) {
    #touch .pause { top: 124px; }
    body.touch #speedo { top: 234px; }
  }

  /* Телефон хоризонтално: ниско е, затова скалите са по-малки, картата отива горе до скалата
     на каросерията, а скоростомерът под нея, за да не застъпват бутоните отдясно. */
  @media (max-height: 500px) {
    .gauge { width: 96px; height: 96px; }
    #timer .now { font-size: 18px; }
    #minimap { top: 8px; right: 112px; width: 96px; height: 96px; }
    #touch .pause { top: 112px; }
    body.touch #speedo { top: 112px; bottom: auto; }
    body.touch #speedo b { font-size: 26px; }
    .sheet43 { width: min(100%, calc(62vh * 4 / 3)); }
    #splash .press { margin-top: 8px; }
    #splash .records { margin-top: 4px; }
    #splash .credits { margin-top: 6px; }
  }

  #debug { position: absolute; left: 14px; bottom: 44px; white-space: pre;
           background: #0b0e14cc; border: 1px solid #2a3142; border-radius: 8px;
           padding: 10px 12px; display: none; color: #b9c4d8; }
  #debug.on { display: block; }

  #keys { position: absolute; left: 14px; bottom: 12px; color: #6d7891; }
  kbd { background: #1b2230; border: 1px solid #39425a; border-bottom-width: 2px;
        border-radius: 4px; padding: 0 5px; color: #cfd8e8; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="gauge fuel" id="fuel-bar">
    <img src="assets/ui/DisplayRicarica.png" class="off" alt="">
    <img src="assets/ui/DisplayRicarica.png" class="fill" id="fuel-fill" alt="fuel" data-i18n-alt="alt.fuel">
  </div>
  <div class="gauge body" id="body-bar">
    <img src="assets/ui/DisplayDanni3.png" class="off" alt="">
    <img src="assets/ui/DisplayDanni3.png" class="fill" id="body-fill" alt="body" data-i18n-alt="alt.body">
  </div>

  <div id="timer"><div class="now" id="timer-now">00:00.00</div><div class="best" id="timer-best"></div><div class="nitro" id="nitro"></div></div>

  <canvas id="minimap" width="340" height="340"></canvas>
  <div id="speedo"><b id="speedo-value">0</b><span>km/h</span></div>

  <div id="splash">
    <div class="sheet43">
      <img id="splash-img" src="assets/ui/loading.png" alt="FFX Runner">
      <button class="hit" id="btn-play" aria-label="Play" data-i18n-aria="aria.play" hidden
              style="left:28%; top:62%; width:44%; height:10%;"></button>
      <button class="hit" id="btn-howto" aria-label="How to play" data-i18n-aria="aria.howto" hidden
              style="left:28%; top:73.5%; width:44%; height:9.5%;"></button>
    </div>
    <div class="press" id="splash-press" data-i18n="wait">please wait…</div>
    <div class="records" id="splash-records"></div>
    <div class="credits" data-i18n="credits"></div>
    <div class="lang" data-i18n="switchLang"></div>
  </div>

  <div id="howto">
    <div class="box">
      <h3 data-i18n="howtoTitle"></h3>
      <p data-i18n="howto1"></p>
      <p data-i18n="howto2"></p>
      <p data-i18n="howto3"></p>
      <div class="back" data-i18n="howtoBack"></div>
    </div>
  </div>

  <div id="countdown"></div>
  <div id="status"></div>
  <div id="debug"></div>

  <div id="over">
    <div class="sheet43">
      <img src="assets/ui/punteggio2.png" alt="">
      <div class="panel" style="left:4%; top:4%; width:42%; height:18%;">
        <small data-i18n="over.left"></small><div id="c-fuel"></div><div id="c-body"></div>
      </div>
      <div class="panel right" style="left:54%; top:4%; width:42%; height:18%;">
        <small data-i18n="over.collected"></small><div id="c-fuelbonus"></div><div id="c-repair"></div>
      </div>
      <div class="panel" style="left:4%; top:28%; width:42%; height:16%;">
        <small data-i18n="over.time"></small><b class="big" id="c-time"></b>
      </div>
      <div class="panel right" style="left:54%; top:28%; width:42%; height:16%;">
        <small data-i18n="over.score"></small><b class="big" id="over-points"></b>
      </div>
      <div class="panel record" id="c-besttime" style="left:4%; top:54%; width:42%; height:16%;"></div>
      <div class="panel record right" id="c-bestpoints" style="left:54%; top:54%; width:42%; height:16%;"></div>
      <div class="status"><h2 id="over-title"></h2><p id="over-sub"></p></div>
    </div>
  </div>

  <div id="pause">
    <div class="box">
      <h3 data-i18n="pauseTitle"></h3>
      <button data-setting="time"></button>
      <button data-setting="weather"></button>
      <button data-setting="quality"></button>
      <button data-setting="relief"></button>
      <button data-setting="blur"></button>
      <button data-setting="fog"></button>
      <button data-setting="ghost"></button>
      <button data-setting="map"></button>
      <button data-setting="difficulty"></button>
      <button data-setting="lang"></button>
      <p class="note" id="pause-note"></p>
      <p class="note" id="pause-build"></p>
      <div class="row"><button id="pause-resume" data-i18n="resume"></button><button id="pause-restart" data-i18n="restart"></button></div>
    </div>
  </div>

  <div id="touch">
    <button class="left" data-key="left">◀</button>
    <button class="right" data-key="right">▶</button>
    <button class="gas" data-key="forward">▲</button>
    <button class="back" data-key="backward">▼</button>
    <button class="brake" data-key="brake" data-i18n="brake"></button>
    <button class="nitro" data-key="nitro">N</button>
    <button class="pause" id="touch-pause">❚❚</button>
  </div>

  <div id="keys" data-i18n="keys"></div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script>
<script type="module" src="game/main.js?v=169"></script>
<script>
  addEventListener('keydown', e => {
    if (e.key === 'd' || e.key === 'D') document.getElementById('debug').classList.toggle('on');
  });
</script>
</body>
</html>
